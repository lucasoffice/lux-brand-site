<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload — Lux Brand Co.</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #faf8f3;
    --ink: #1a1a1a;
    --red: #c0140c;
    --red-hover: #a01008;
    --red-emph: #b91c1c;
    --mid: #bfb8a3;
    --mid-soft: rgba(191, 184, 163, 0.3);
    --paper: #f6f3ec;
    --tab-font: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --body-font: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }

  html, body {
    background: var(--cream);
    color: var(--ink);
    font-family: var(--body-font);
    line-height: 1.5;
    min-height: 100%;
  }
  body { padding: 56px 0 80px; overflow-x: hidden; }

  body::after {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none; z-index: 999;
    opacity: .18;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2.5' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
  }

  #top-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(250, 248, 243, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--mid-soft);
    padding: 0 40px;
  }
  .nav-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px;
  }
  .nav-brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    font-family: var(--tab-font);
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.25em;
    color: var(--ink);
    text-transform: uppercase;
    line-height: 1;
  }
  .nav-brand .logo {
    width: 28px; height: 28px;
    display: block;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.10));
  }
  .nav-brand .dot { color: var(--red); }
  .nav-links { display: flex; gap: 36px; }
  .nav-link {
    font-family: var(--tab-font);
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.25em;
    color: var(--ink); opacity: 0.5;
    text-decoration: none;
    cursor: pointer;
    padding: 18px 0;
    position: relative;
    transition: opacity 0.25s ease;
    text-transform: uppercase;
  }
  .nav-link:hover { opacity: 0.85; }
  .nav-link.active { opacity: 1; }
  .nav-link.active::after {
    content: '';
    position: absolute;
    bottom: 16px; left: 0; right: 0;
    height: 1px; background: var(--red);
  }
  @media (max-width: 768px) {
    #top-nav { padding: 0 20px; }
    .nav-inner { height: 52px; }
    .nav-link { font-size: 9px; letter-spacing: 0.2em; }
    .nav-links { gap: 22px; }
    .nav-brand { font-size: 0; }  /* hide wordmark text on mobile, keep logo */
    .nav-brand .logo { width: 24px; height: 24px; }
  }

  .page { max-width: 640px; margin: 0 auto; padding: 80px 24px 0; }

  .hero { margin-bottom: 56px; text-align: center; }
  .hero-eyebrow {
    font-family: var(--tab-font);
    font-size: 9px; letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink); opacity: 0.5;
    margin-bottom: 18px;
  }
  .hero-title {
    font-family: var(--body-font);
    font-size: clamp(28px, 4.5vw, 42px);
    font-weight: 400; line-height: 1.15;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 18px;
  }
  .hero-sub {
    font-family: var(--body-font);
    font-size: 15px; line-height: 1.7;
    color: #666; font-weight: 300;
    max-width: 460px; margin: 0 auto;
  }
  .hero-rule {
    width: 40px; height: 2px;
    background: var(--red);
    margin: 24px auto 0;
    opacity: 0.5;
  }

  .sec-label {
    font-family: var(--tab-font);
    font-size: 9px; letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink); opacity: 0.5;
    margin-bottom: 14px;
  }

  .drop {
    border: 1.5px dashed var(--mid);
    background: var(--paper);
    padding: 64px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    position: relative;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
  }
  .drop::before {
    content: '';
    position: absolute;
    top: 6px; left: 6px; right: 6px; bottom: 6px;
    border: 1px solid rgba(191, 184, 163, 0.3);
    pointer-events: none;
  }
  .drop:hover, .drop.over { border-color: var(--red); background: #f9f5ea; }
  .drop.has-file {
    border-style: solid;
    border-color: var(--ink);
    padding: 36px 24px;
  }
  .drop-text { font-family: var(--body-font); font-size: 14px; color: #666; line-height: 1.6; }
  .drop-text strong { color: var(--ink); font-weight: 500; }
  .drop-meta {
    font-family: var(--tab-font);
    font-size: 9px; letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #999; margin-top: 8px;
  }
  .drop-file {
    font-family: var(--body-font);
    font-size: 18px; font-weight: 500;
    color: var(--ink);
    word-break: break-all; line-height: 1.3;
  }
  .drop-prompt {
    font-family: var(--tab-font);
    font-size: 9px; letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #999; margin-top: 12px;
  }

  .form { margin-top: 40px; }
  .field { margin-bottom: 28px; }
  .field-label {
    display: block;
    font-family: var(--tab-font);
    font-size: 9px; letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink); opacity: 0.55;
    margin-bottom: 6px;
  }
  .field-input,
  .field-textarea {
    width: 100%;
    padding: 12px 0;
    border: none;
    border-bottom: 1px solid #d4cfc0;
    background: transparent;
    outline: none;
    font-family: var(--body-font);
    font-size: 16px;
    color: var(--ink);
    transition: border-color 0.2s;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  .field-textarea { resize: vertical; min-height: 70px; line-height: 1.6; }
  .field-input:focus, .field-textarea:focus { border-color: var(--ink); }
  .field-input::placeholder, .field-textarea::placeholder {
    font-family: var(--tab-font);
    font-size: 11px; letter-spacing: 0.14em;
    color: #aaa; text-transform: uppercase;
  }

  /* Retention pill group — keep this as a pill picker since there are exactly 3 fixed options */
  .retention-pills {
    display: flex; gap: 0;
    border: 1px solid #d4cfc0;
  }
  .retention-pills input[type="radio"] {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }
  .retention-pills label {
    flex: 1;
    padding: 11px 8px;
    text-align: center;
    cursor: pointer;
    font-family: var(--tab-font);
    font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #666;
    background: transparent;
    transition: all 0.15s;
    border-right: 1px solid #d4cfc0;
    user-select: none;
  }
  .retention-pills label:last-of-type { border-right: none; }
  .retention-pills label:hover { color: var(--ink); background: #f4ede0; }
  .retention-pills input:checked + label {
    background: var(--ink);
    color: var(--cream);
  }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 480px) {
    .field-row { grid-template-columns: 1fr; gap: 0; }
  }

  .btn-primary {
    display: inline-block; width: 100%;
    background: var(--red); color: #fff;
    border: none; cursor: pointer;
    font-family: var(--tab-font);
    font-size: 11px; letter-spacing: 0.22em;
    font-weight: 500;
    padding: 18px 0;
    text-transform: uppercase;
    text-align: center;
    transition: background 0.3s, transform 0.2s;
    margin-top: 16px;
  }
  .btn-primary:hover:not(:disabled) { background: var(--red-hover); transform: scale(1.01); }
  .btn-primary:disabled { background: #c8c2b2; cursor: not-allowed; transform: none; }
  .btn-outline {
    display: inline-block;
    background: none;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    font-family: var(--tab-font);
    font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 14px 32px;
    text-decoration: none;
    transition: background 0.3s, color 0.3s;
  }
  .btn-outline:hover { background: var(--ink); color: var(--cream); }

  #log {
    margin-top: 22px;
    font-family: var(--tab-font);
    font-size: 11px; letter-spacing: 0.06em;
    color: #999;
    line-height: 1.9;
  }
  #log > div { padding: 1px 0; }
  #log .ok { color: #4a7c4a; }
  #log .err { color: var(--red-emph); font-weight: 500; }

  .success {
    display: none;
    margin-top: 36px;
    padding: 36px 32px;
    background: var(--paper);
    border: 1px solid var(--mid);
    border-left: 3px solid var(--red);
    box-shadow: 0 1px 0 rgba(0,0,0,0.02);
  }
  .success.show { display: block; }
  .success-eyebrow {
    font-family: var(--tab-font);
    font-size: 9px; letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 8px;
  }
  .success-title {
    font-family: var(--body-font);
    font-size: 24px; font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 4px;
    word-break: break-all;
  }
  .success-info {
    font-family: var(--tab-font);
    font-size: 10px; letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 18px;
  }
  .success-fileid {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px; color: #888;
    word-break: break-all;
    margin-bottom: 22px;
    padding: 10px 12px;
    background: var(--cream);
    border: 1px solid var(--mid-soft);
  }
  .success-actions { display: flex; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>

<nav id="top-nav">
  <div class="nav-inner">
    <a class="nav-brand" href="https://lbco.com" aria-label="Lux Brand Co. home">
      <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="100" height="100" fill="#c0140c"/>
        <rect x="13" y="13" width="74" height="74" fill="none" stroke="#fff" stroke-width="3"/>
        <g fill="#fff" font-family="-apple-system, 'Helvetica Neue', Arial Black, sans-serif" font-weight="900" text-anchor="middle">
          <text x="36" y="51" font-size="32">L</text>
          <text x="64" y="51" font-size="32">B</text>
          <text x="36" y="83" font-size="32">C</text>
          <text x="64" y="83" font-size="26">o</text>
        </g>
      </svg>
      <span>LUX BRAND CO<span class="dot">.</span></span>
    </a>
    <div class="nav-links">
      <a class="nav-link active" href="/upload">Upload</a>
      <a class="nav-link" href="/download">Download</a>
    </div>
  </div>
</nav>

<main class="page">

  <section class="hero">
    <div class="hero-eyebrow">Brain · File Sharing</div>
    <h1 class="hero-title">Upload a file the team can find later.</h1>
    <p class="hero-sub">Drop it here, give it a sentence of context, and it shows up for every architect's AI in seconds.</p>
    <div class="hero-rule"></div>
  </section>

  <div class="sec-label">File</div>
  <div id="drop" class="drop" tabindex="0" role="button" aria-label="Choose or drop a file">
    <div id="drop-empty">
      <div class="drop-text"><strong>Drag a file here</strong> &nbsp; or click to choose</div>
      <div class="drop-meta">Up to 500 MB</div>
    </div>
    <div id="drop-filled" hidden>
      <div class="drop-file" id="drop-name"></div>
      <div class="drop-meta" id="drop-size"></div>
      <div class="drop-prompt">Click to change</div>
    </div>
    <input type="file" id="file" hidden>
  </div>

  <div class="form">
    <div class="field">
      <label class="field-label" for="description">Description &mdash; what is this</label>
      <textarea class="field-textarea" id="description" placeholder="Describe what this file is and why anyone should care"></textarea>
    </div>

    <div class="field-row">
      <div class="field">
        <label class="field-label" for="project">Project</label>
        <input class="field-input" type="text" id="project" placeholder="e.g. Bid Builder" autocomplete="off">
      </div>
      <div class="field">
        <label class="field-label" for="architect">Your name</label>
        <input class="field-input" type="text" id="architect" placeholder="brady" autocomplete="name">
      </div>
    </div>

    <div class="field">
      <label class="field-label">Keep for</label>
      <div class="retention-pills">
        <input type="radio" name="retention" id="ret-default" value="default" checked>
        <label for="ret-default">180 days</label>
        <input type="radio" name="retention" id="ret-permanent" value="permanent">
        <label for="ret-permanent">Forever</label>
        <input type="radio" name="retention" id="ret-ephemeral" value="ephemeral">
        <label for="ret-ephemeral">7 days</label>
      </div>
    </div>

    <button class="btn-primary" id="upload" disabled>Upload</button>
    <div id="log" aria-live="polite"></div>

    <div class="success" id="success">
      <div class="success-eyebrow">Uploaded</div>
      <div class="success-title" id="success-name"></div>
      <div class="success-info" id="success-info"></div>
      <div class="success-fileid" id="success-id"></div>
      <div class="success-actions">
        <a class="btn-outline" href="/download">Browse files</a>
        <button class="btn-outline" onclick="location.reload()">Upload another</button>
      </div>
    </div>
  </div>

</main>

<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), fileInput = $('file');
let selectedFile = null;

const archInput = $('architect');
archInput.value = localStorage.getItem('lbco-architect') || '';
archInput.addEventListener('change', () => localStorage.setItem('lbco-architect', archInput.value.trim()));
archInput.addEventListener('input', updateSubmitState);
$('description').addEventListener('input', updateSubmitState);

const projInput = $('project');
projInput.value = localStorage.getItem('lbco-last-project') || '';
projInput.addEventListener('change', () => {
  const v = projInput.value.trim();
  if (v) localStorage.setItem('lbco-last-project', v);
});

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
});
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('over');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(2) + ' GB';
}

function handleFile(f) {
  if (f.size > 500 * 1024 * 1024) {
    log('File too large (max 500 MB)', 'err');
    return;
  }
  selectedFile = f;
  $('drop-empty').hidden = true;
  $('drop-filled').hidden = false;
  $('drop-name').textContent = f.name;
  $('drop-size').textContent = fmtSize(f.size) + ' · ' + (f.type || 'unknown type');
  drop.classList.add('has-file');
  updateSubmitState();
}

function updateSubmitState() {
  $('upload').disabled = !selectedFile || !$('description').value.trim() || !archInput.value.trim();
}

function log(msg, cls = '') {
  const el = $('log');
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = msg;
  el.appendChild(div);
}

function getRetention() {
  const checked = document.querySelector('input[name="retention"]:checked');
  return checked ? checked.value : 'default';
}

$('upload').addEventListener('click', async () => {
  if (!selectedFile) return;
  const btn = $('upload');
  btn.disabled = true;
  btn.textContent = 'Uploading…';
  $('log').innerHTML = '';

  try {
    log('Requesting upload URL…');
    const meta = {
      filename: selectedFile.name,
      content_type: selectedFile.type || 'application/octet-stream',
      size_bytes: selectedFile.size,
      architect: archInput.value.trim(),
      description: $('description').value.trim(),
      retention: getRetention(),
    };
    const proj = projInput.value.trim();
    if (proj) meta.linked_project = proj;

    const r1 = await fetch('/api/upload-url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(meta),
    });
    const r1text = await r1.text();
    if (!r1.ok) throw new Error('upload-url failed (' + r1.status + '): ' + r1text);
    const r1data = JSON.parse(r1text);

    const url = r1data.upload_url;
    const fileId = r1data.file_id;
    const taggingHeader = r1data.tagging_header || ('retention=' + meta.retention);
    if (!url || !fileId) throw new Error('Unexpected response: ' + r1text);
    log('Reserved file_id ' + fileId, 'ok');

    log('Uploading bytes to S3…');
    const r2 = await fetch(url, {
      method: 'PUT',
      headers: {
        'Content-Type': meta.content_type,
        'x-amz-tagging': taggingHeader,
      },
      body: selectedFile,
    });
    if (!r2.ok) {
      const errText = await r2.text();
      throw new Error('S3 PUT failed (' + r2.status + '): ' + errText.slice(0, 500));
    }
    log('Uploaded.', 'ok');

    $('success-name').textContent = selectedFile.name;
    $('success-info').textContent =
      fmtSize(selectedFile.size) +
      ' · ' + (meta.retention === 'default' ? '180 days' : meta.retention === 'permanent' ? 'kept forever' : '7 days') +
      (proj ? ' · ' + proj : '');
    $('success-id').textContent = fileId;
    $('success').classList.add('show');
    btn.style.display = 'none';
  } catch (err) {
    log(err.message, 'err');
    btn.disabled = false;
    btn.textContent = 'Upload';
  }
});
</script>
</body>
</html>
