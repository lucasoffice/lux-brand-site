<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download — Lux Brand Co.</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #faf8f3;
    --ink: #1a1a1a;
    --red: #c0140c;
    --red-hover: #a01008;
    --red-emph: #b91c1c;
    --mid: #bfb8a3;
    --mid-soft: rgba(191, 184, 163, 0.3);
    --paper: #f6f3ec;
    --tab-font: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --body-font: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }

  html, body {
    background: var(--cream);
    color: var(--ink);
    font-family: var(--body-font);
    line-height: 1.5;
    min-height: 100%;
  }
  body { padding: 56px 0 80px; overflow-x: hidden; }

  body::after {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none; z-index: 999;
    opacity: .18;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2.5' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
  }

  #top-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(250, 248, 243, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--mid-soft);
    padding: 0 40px;
  }
  .nav-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px;
  }
  .nav-brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    font-family: var(--tab-font);
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.25em;
    color: var(--ink);
    text-transform: uppercase;
    line-height: 1;
  }
  .nav-brand .logo {
    width: 28px; height: 28px;
    display: block; flex-shrink: 0;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.10));
  }
  .nav-brand .dot { color: var(--red); }
  .nav-links { display: flex; gap: 36px; }
  .nav-link {
    font-family: var(--tab-font);
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.25em;
    color: var(--ink); opacity: 0.5;
    text-decoration: none; cursor: pointer;
    padding: 18px 0;
    position: relative;
    transition: opacity 0.25s ease;
    text-transform: uppercase;
  }
  .nav-link:hover { opacity: 0.85; }
  .nav-link.active { opacity: 1; }
  .nav-link.active::after {
    content: '';
    position: absolute;
    bottom: 16px; left: 0; right: 0;
    height: 1px; background: var(--red);
  }
  @media (max-width: 768px) {
    #top-nav { padding: 0 20px; }
    .nav-inner { height: 52px; }
    .nav-link { font-size: 9px; letter-spacing: 0.2em; }
    .nav-links { gap: 22px; }
    .nav-brand { font-size: 0; }
    .nav-brand .logo { width: 24px; height: 24px; }
  }

  .page { max-width: 760px; margin: 0 auto; padding: 80px 24px 0; }

  .hero { margin-bottom: 48px; text-align: center; }
  .hero-eyebrow {
    font-family: var(--tab-font);
    font-size: 9px; letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink); opacity: 0.5;
    margin-bottom: 18px;
  }
  .hero-title {
    font-family: var(--body-font);
    font-size: clamp(28px, 4.5vw, 42px);
    font-weight: 400; line-height: 1.15;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 18px;
  }
  .hero-sub {
    font-family: var(--body-font);
    font-size: 15px; line-height: 1.7;
    color: #666; font-weight: 300;
    max-width: 460px; margin: 0 auto;
  }
  .hero-rule {
    width: 40px; height: 2px;
    background: var(--red);
    margin: 24px auto 0;
    opacity: 0.5;
  }

  /* Search row */
  .search-row { margin-bottom: 24px; position: relative; }
  .search-input {
    width: 100%;
    padding: 14px 0 14px 32px;
    border: none;
    border-bottom: 1px solid #d4cfc0;
    background: transparent;
    outline: none;
    font-family: var(--body-font);
    font-size: 16px;
    color: var(--ink);
    transition: border-color 0.2s;
    border-radius: 0;
  }
  .search-input:focus { border-bottom-color: var(--ink); }
  .search-input::placeholder {
    font-family: var(--tab-font);
    font-size: 12px; letter-spacing: 0.14em;
    color: #aaa; text-transform: uppercase;
  }
  .search-icon {
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    pointer-events: none;
    color: #888;
  }
  .search-spinner {
    position: absolute;
    right: 0; top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    border: 1.5px solid #d4cfc0;
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .search-row.searching .search-spinner { display: block; }
  @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

  /* Filters */
  .filters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--mid-soft);
    margin-bottom: 28px;
  }
  @media (max-width: 480px) {
    .filters { grid-template-columns: 1fr; gap: 0; }
  }
  .filter { }
  .filter-label {
    display: block;
    font-family: var(--tab-font);
    font-size: 9px; letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink); opacity: 0.55;
    margin-bottom: 6px;
  }
  .filter-input {
    width: 100%;
    padding: 10px 0;
    border: none;
    border-bottom: 1px solid #d4cfc0;
    background: transparent;
    outline: none;
    font-family: var(--body-font);
    font-size: 15px;
    color: var(--ink);
    transition: border-color 0.2s;
    border-radius: 0;
  }
  .filter-input:focus { border-bottom-color: var(--ink); }
  .filter-input::placeholder {
    font-family: var(--tab-font);
    font-size: 11px; letter-spacing: 0.14em;
    color: #aaa; text-transform: uppercase;
  }
  .filter-clear {
    background: none;
    border: none;
    color: var(--red);
    font-family: var(--tab-font);
    font-size: 9px; letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 0;
    margin-top: 6px;
    text-decoration: underline;
    text-underline-offset: 3px;
    display: none;
  }
  .filter-clear.show { display: inline-block; }
  .filter-clear:hover { color: var(--red-hover); }

  #status {
    text-align: center;
    font-family: var(--tab-font);
    font-size: 11px; letter-spacing: 0.18em;
    color: #999; text-transform: uppercase;
    padding: 56px 20px;
  }
  #status.err { color: var(--red-emph); text-transform: none; letter-spacing: 0.04em; font-size: 13px; font-weight: 500; }

  .file {
    background: var(--paper);
    border: 1px solid var(--mid-soft);
    padding: 26px 28px;
    margin-bottom: 14px;
    transition: border-color 0.2s, background 0.2s;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02);
  }
  .file:hover {
    border-color: var(--mid);
    background: #f3eddf;
  }
  .file-name {
    font-family: var(--body-font);
    font-size: 22px; font-weight: 400;
    letter-spacing: -0.015em;
    line-height: 1.25;
    color: var(--ink);
    margin-bottom: 8px;
    word-break: break-word;
  }
  .pin {
    color: var(--red);
    margin-left: 6px;
    font-size: 14px;
    vertical-align: middle;
  }
  .score {
    display: inline-block;
    margin-left: 10px;
    font-family: var(--tab-font);
    font-size: 9px; letter-spacing: 0.2em;
    color: var(--red);
    background: rgba(192, 20, 12, 0.06);
    padding: 3px 10px;
    vertical-align: middle;
    text-transform: uppercase;
    font-weight: 500;
    border: 1px solid rgba(192, 20, 12, 0.15);
  }
  .file-meta {
    font-family: var(--tab-font);
    font-size: 10px; letter-spacing: 0.18em;
    color: #888; text-transform: uppercase;
    margin-bottom: 14px;
  }
  .file-meta .proj {
    background: var(--mid-soft);
    padding: 3px 9px;
    margin-left: 8px;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: 0.14em;
    cursor: pointer;
  }
  .file-meta .proj:hover { background: rgba(191, 184, 163, 0.55); }
  .file-meta .arch { cursor: pointer; }
  .file-meta .arch:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
  .file-desc {
    font-family: var(--body-font);
    font-size: 14px; line-height: 1.7;
    color: #555;
    margin-bottom: 18px;
  }
  .file-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .file-actions button, .file-actions a {
    font-family: var(--tab-font);
    font-size: 9px; letter-spacing: 0.2em;
    color: var(--ink); text-transform: uppercase;
    background: var(--cream);
    border: 1px solid var(--mid);
    cursor: pointer;
    padding: 9px 18px;
    transition: background 0.25s, color 0.25s, border-color 0.25s;
    font-weight: 500;
    text-decoration: none;
    display: inline-block;
  }
  .file-actions button:hover, .file-actions a:hover {
    background: var(--ink);
    color: var(--cream);
    border-color: var(--ink);
  }
  .file-actions button.del { border-color: rgba(192, 20, 12, 0.35); color: var(--red); }
  .file-actions button.del:hover {
    background: var(--red); color: var(--cream); border-color: var(--red);
  }
  .file-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
  .file-id {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 10px;
    color: #b0b0a8;
    margin-top: 14px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<nav id="top-nav">
  <div class="nav-inner">
    <a class="nav-brand" href="https://lbco.com" aria-label="Lux Brand Co. home">
      <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="100" height="100" fill="#c0140c"/>
        <rect x="13" y="13" width="74" height="74" fill="none" stroke="#fff" stroke-width="3"/>
        <g fill="#fff" font-family="-apple-system, 'Helvetica Neue', Arial Black, sans-serif" font-weight="900" text-anchor="middle">
          <text x="36" y="51" font-size="32">L</text>
          <text x="64" y="51" font-size="32">B</text>
          <text x="36" y="83" font-size="32">C</text>
          <text x="64" y="83" font-size="26">o</text>
        </g>
      </svg>
      <span>LUX BRAND CO<span class="dot">.</span></span>
    </a>
    <div class="nav-links">
      <a class="nav-link" href="/upload">Upload</a>
      <a class="nav-link active" href="/download">Download</a>
    </div>
  </div>
</nav>

<main class="page">

  <section class="hero">
    <div class="hero-eyebrow">Brain · File Sharing</div>
    <h1 class="hero-title">What the team has shared.</h1>
    <p class="hero-sub">Search by what it's about. Pinned files are kept forever. Text-like files can be read inline.</p>
    <div class="hero-rule"></div>
  </section>

  <div class="search-row" id="search-row">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/>
      <path d="M21 21l-4.35-4.35"/>
    </svg>
    <input type="text" id="q" class="search-input" placeholder="Type to search what the file is about — leave blank for recent" autocomplete="off">
    <div class="search-spinner" aria-hidden="true"></div>
  </div>

  <div class="filters">
    <div class="filter">
      <label class="filter-label" for="proj">Project</label>
      <input type="text" id="proj" class="filter-input" placeholder="Filter by project name" autocomplete="off">
      <button type="button" class="filter-clear" id="proj-clear">Clear</button>
    </div>
    <div class="filter">
      <label class="filter-label" for="arch">Architect</label>
      <input type="text" id="arch" class="filter-input" placeholder="Filter by name" autocomplete="off">
      <button type="button" class="filter-clear" id="arch-clear">Clear</button>
    </div>
  </div>

  <div id="status">Loading recent files…</div>
  <div id="results"></div>

</main>

<script>
const $ = id => document.getElementById(id);

function fmtSize(b) {
  if (!b) return '—';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(2) + ' GB';
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function isTextLike(f) {
  const ct = (f.content_type || '').toLowerCase();
  if (ct.startsWith('text/') || ct.includes('json') || ct.includes('yaml') ||
      ct.includes('javascript') || ct.includes('xml')) return true;
  return /\.(md|txt|json|yaml|yml|js|ts|jsx|tsx|py|sh|html|css|csv|log|conf|toml|ini|sql)$/.test(
    (f.filename || '').toLowerCase()
  );
}

function renderFile(f, score) {
  const isPermanent = f.retention === 'permanent';
  const pin = isPermanent ? '<span class="pin" title="Permanent">📌</span>' : '';
  const scoreBadge = (score != null) ? '<span class="score">' + (score * 100).toFixed(0) + '% match</span>' : '';
  const proj = f.linked_project
    ? '<span class="proj" data-proj="' + escHtml(f.linked_project) + '">' + escHtml(f.linked_project) + '</span>'
    : '';
  const arch = f.architect
    ? '<span class="arch" data-arch="' + escHtml(f.architect) + '">' + escHtml(f.architect) + '</span>'
    : '<span class="arch">unknown</span>';
  const viewBtn = isTextLike(f)
    ? `<button onclick="viewFile('${escHtml(f.file_id)}', this)">View inline</button>`
    : '';
  return `<div class="file" data-id="${escHtml(f.file_id)}">
    <div class="file-name">${escHtml(f.filename)}${pin}${scoreBadge}</div>
    <div class="file-meta">
      ${escHtml(fmtDate(f.created_at))} · ${arch} · ${escHtml(fmtSize(f.size_bytes))}${proj}
    </div>
    ${f.description ? '<div class="file-desc">' + escHtml(f.description) + '</div>' : ''}
    <div class="file-actions">
      <button onclick="dl('${escHtml(f.file_id)}', this)">Download</button>
      ${viewBtn}
      <button class="del" onclick="del('${escHtml(f.file_id)}', '${escHtml(f.filename).replace(/'/g, '&#39;')}', ${isPermanent})">Delete</button>
    </div>
    <div class="file-id">${escHtml(f.file_id)}</div>
  </div>`;
}

let activeRequest = 0;

async function load() {
  const q = $('q').value.trim();
  const proj = $('proj').value.trim();
  const arch = $('arch').value.trim();
  const status = $('status'), results = $('results');

  // Toggle clear buttons
  $('proj-clear').classList.toggle('show', !!proj);
  $('arch-clear').classList.toggle('show', !!arch);

  // Show spinner
  $('search-row').classList.add('searching');

  // Track this request — late results from earlier requests get discarded
  const reqId = ++activeRequest;
  status.classList.remove('err');

  try {
    const body = q ? { query: q, limit: 25 } : { limit: 50 };
    if (proj) body.linked_project = proj;
    if (arch) body.architect = arch;
    const endpoint = q ? '/api/search' : '/api/list';

    const r = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    // Stale response — newer query already in flight
    if (reqId !== activeRequest) return;

    const text = await r.text();
    if (!r.ok) throw new Error(r.status + ': ' + text);
    const data = JSON.parse(text);
    const items = data.files || data.results || data.items || [];

    $('search-row').classList.remove('searching');

    if (items.length === 0) {
      results.innerHTML = '';
      status.style.display = 'block';
      status.textContent = q ? 'No matches.' : 'No files yet.';
      return;
    }
    status.style.display = 'none';
    results.innerHTML = items.map(item => {
      const meta = item.file || item.item || item;
      const score = item.score != null ? item.score : item._score;
      return renderFile(meta, score);
    }).join('');
  } catch (err) {
    if (reqId !== activeRequest) return;
    $('search-row').classList.remove('searching');
    results.innerHTML = '';
    status.style.display = 'block';
    status.textContent = 'Failed: ' + err.message;
    status.classList.add('err');
  }
}

// Debounced load
let debounceTimer = null;
function debouncedLoad(delay = 300) {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(load, delay);
}

// Wire inputs to search-as-you-type
$('q').addEventListener('input', () => debouncedLoad(300));
$('proj').addEventListener('input', () => debouncedLoad(350));
$('arch').addEventListener('input', () => debouncedLoad(350));

// Clear-buttons
$('proj-clear').addEventListener('click', () => {
  $('proj').value = '';
  $('proj-clear').classList.remove('show');
  load();
});
$('arch-clear').addEventListener('click', () => {
  $('arch').value = '';
  $('arch-clear').classList.remove('show');
  load();
});

// Click on architect or project chip in a file card → set filter to that value
document.addEventListener('click', e => {
  const projChip = e.target.closest('.proj[data-proj]');
  if (projChip) {
    e.preventDefault();
    $('proj').value = projChip.dataset.proj;
    $('proj-clear').classList.add('show');
    load();
    return;
  }
  const archChip = e.target.closest('.arch[data-arch]');
  if (archChip) {
    e.preventDefault();
    $('arch').value = archChip.dataset.arch;
    $('arch-clear').classList.add('show');
    load();
  }
});

async function dl(file_id, btn) {
  const orig = btn.textContent;
  btn.textContent = '…';
  btn.disabled = true;
  try {
    const r = await fetch('/api/download-url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file_id }),
    });
    const text = await r.text();
    if (!r.ok) throw new Error(r.status + ': ' + text);
    const data = JSON.parse(text);
    const url = data.download_url || data.url;
    if (!url) throw new Error('No URL in response');
    window.open(url, '_blank');
  } catch (err) {
    alert('Download failed: ' + err.message);
  }
  btn.textContent = orig;
  btn.disabled = false;
}

async function viewFile(file_id, btn) {
  const orig = btn.textContent;
  btn.textContent = '…';
  btn.disabled = true;
  try {
    const r = await fetch('/api/contents', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file_id }),
    });
    const text = await r.text();
    if (r.status === 415) {
      alert('This is a binary file — use Download instead.');
      btn.textContent = orig;
      btn.disabled = false;
      return;
    }
    if (!r.ok) throw new Error(r.status + ': ' + text);
    const data = JSON.parse(text);
    const contents = data.contents || data.body || data.text || JSON.stringify(data, null, 2);
    const w = window.open('', '_blank');
    w.document.write(
      '<!doctype html><html><head><meta charset="utf-8"><title>' + escHtml(file_id) +
      '</title><style>body{font-family:ui-monospace,SF Mono,Menlo,monospace;font-size:13px;padding:32px;background:#faf8f3;color:#1a1a1a;line-height:1.55;}pre{white-space:pre-wrap;word-break:break-word;margin:0;max-width:900px;}</style></head><body><pre>' +
      escHtml(contents) + '</pre></body></html>'
    );
    w.document.close();
  } catch (err) {
    alert('View failed: ' + err.message);
  }
  btn.textContent = orig;
  btn.disabled = false;
}

async function del(file_id, filename, isPermanent) {
  if (isPermanent) {
    alert('"' + filename + '" is permanent. Remove the retention=permanent tag in the AWS console first.');
    return;
  }
  let arch = localStorage.getItem('lbco-architect');
  if (!arch) {
    arch = prompt('Your name (for delete audit):');
    if (!arch) return;
    arch = arch.trim();
    localStorage.setItem('lbco-architect', arch);
  }
  if (!confirm('Delete "' + filename + '"? This cannot be undone.')) return;
  try {
    const r = await fetch('/api/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file_id, requesting_architect: arch }),
    });
    if (!r.ok) throw new Error(r.status + ': ' + await r.text());
    load();
  } catch (err) {
    alert('Delete failed: ' + err.message);
  }
}

// Initial load
load();
</script>
</body>
</html>
