<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Browse — Lux Brand Co.</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #faf8f3;
    --ink: #1a1a1a;
    --red: #c0140c;
    --red-hover: #a01008;
    --red-emph: #b91c1c;
    --mid: #bfb8a3;
    --mid-soft: rgba(191, 184, 163, 0.3);
    --paper: #f6f3ec;
    --tab-font: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --body-font: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }

  html, body {
    background: var(--cream);
    color: var(--ink);
    font-family: var(--body-font);
    line-height: 1.5;
    min-height: 100%;
  }
  body { padding: 56px 0 80px; overflow-x: hidden; }

  body::after {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none; z-index: 999;
    opacity: .18;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2.5' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
  }

  #top-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(250, 248, 243, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--mid-soft);
    padding: 0 40px;
  }
  .nav-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px;
  }
  .nav-brand {
    font-family: var(--tab-font);
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.25em;
    color: var(--ink);
    text-decoration: none;
    text-transform: uppercase;
  }
  .nav-brand .dot { color: var(--red); }
  .nav-links { display: flex; gap: 36px; }
  .nav-link {
    font-family: var(--tab-font);
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.25em;
    color: var(--ink); opacity: 0.5;
    text-decoration: none;
    cursor: pointer;
    padding: 18px 0;
    position: relative;
    transition: opacity 0.25s ease;
    text-transform: uppercase;
  }
  .nav-link:hover { opacity: 0.85; }
  .nav-link.active { opacity: 1; }
  .nav-link.active::after {
    content: '';
    position: absolute;
    bottom: 16px; left: 0; right: 0;
    height: 1px; background: var(--red);
  }
  @media (max-width: 768px) {
    #top-nav { padding: 0 20px; }
    .nav-inner { height: 48px; }
    .nav-link { font-size: 9px; letter-spacing: 0.2em; }
    .nav-links { gap: 22px; }
    .nav-brand { font-size: 9px; letter-spacing: 0.2em; }
  }

  .page { max-width: 760px; margin: 0 auto; padding: 80px 24px 0; }

  .hero { margin-bottom: 48px; text-align: center; }
  .hero-eyebrow {
    font-family: var(--tab-font);
    font-size: 9px; letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink); opacity: 0.5;
    margin-bottom: 18px;
  }
  .hero-title {
    font-family: var(--body-font);
    font-size: clamp(28px, 4.5vw, 42px);
    font-weight: 400; line-height: 1.15;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 18px;
  }
  .hero-sub {
    font-family: var(--body-font);
    font-size: 15px; line-height: 1.7;
    color: #666; font-weight: 300;
    max-width: 460px; margin: 0 auto;
  }
  .hero-rule {
    width: 40px; height: 2px;
    background: var(--red);
    margin: 24px auto 0;
    opacity: 0.5;
  }

  .search-row {
    display: flex; gap: 16px;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 4px;
    margin-bottom: 24px;
  }
  .search-input {
    flex: 1;
    border: none; outline: none;
    background: transparent;
    font-family: var(--body-font);
    font-size: 17px;
    color: var(--ink);
    padding: 12px 0;
  }
  .search-input::placeholder {
    font-family: var(--tab-font);
    font-size: 11px; letter-spacing: 0.14em;
    color: #aaa; text-transform: uppercase;
  }
  .search-go {
    background: none; border: none;
    font-family: var(--tab-font);
    font-size: 10px; letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink);
    cursor: pointer;
    padding: 0 4px;
    transition: color 0.2s;
  }
  .search-go:hover { color: var(--red); }

  .filters {
    display: flex; gap: 18px; flex-wrap: wrap;
    align-items: center;
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--mid-soft);
  }
  .filter-group { display: flex; align-items: center; gap: 10px; }
  .filter-label {
    font-family: var(--tab-font);
    font-size: 9px; letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #999;
  }
  .filter-select {
    padding: 6px 22px 6px 0;
    border: none;
    border-bottom: 1px solid #d4cfc0;
    background: transparent;
    outline: none;
    font-family: var(--body-font);
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    border-radius: 0;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--ink) 50%),
      linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 8px) 12px, calc(100% - 4px) 12px;
    background-size: 4px 4px, 4px 4px;
    background-repeat: no-repeat;
  }
  .filter-select:focus { border-color: var(--ink); }

  .files { display: flex; flex-direction: column; gap: 14px; }
  .file {
    background: var(--paper);
    border: 1px solid var(--mid-soft);
    padding: 24px 28px 22px;
    transition: border-color 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .file:hover {
    border-color: var(--mid);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }
  .file-name {
    font-family: var(--body-font);
    font-size: 20px; font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.25;
    color: var(--ink);
    word-break: break-word;
    margin-bottom: 8px;
  }
  .file-name .pin {
    color: var(--red);
    margin-left: 6px;
    font-size: 14px;
    vertical-align: middle;
  }
  .score-badge {
    display: inline-block;
    font-family: var(--tab-font);
    font-size: 9px; letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--red);
    margin-left: 10px;
    vertical-align: middle;
    font-weight: 600;
  }
  .file-meta {
    font-family: var(--tab-font);
    font-size: 9px; letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 12px;
  }
  .file-meta .sep { margin: 0 8px; opacity: 0.5; }
  .file-meta .proj {
    color: var(--ink);
    border-bottom: 1px solid var(--mid);
    padding-bottom: 1px;
  }
  .file-desc {
    font-family: var(--body-font);
    font-size: 14px; line-height: 1.6;
    color: #444;
    margin-bottom: 16px;
  }
  .file-snippet {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px; line-height: 1.55;
    color: #888;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.4);
    border-left: 2px solid var(--mid);
    margin-bottom: 16px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 80px; overflow: hidden;
  }
  .file-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .file-action {
    background: none;
    border: 1px solid var(--mid);
    color: var(--ink);
    font-family: var(--tab-font);
    font-size: 9px; letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 8px 14px;
    text-decoration: none;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .file-action:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  .file-action.danger { border-color: rgba(192, 20, 12, 0.3); color: var(--red); }
  .file-action.danger:hover { background: var(--red); color: var(--cream); border-color: var(--red); }
  .file-id {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 10px;
    color: #b8b3a3;
    margin-top: 12px;
    word-break: break-all;
  }

  #status {
    font-family: var(--tab-font);
    font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #999;
    text-align: center;
    padding: 60px 20px;
  }
  #status.err { color: var(--red-emph); letter-spacing: 0.06em; text-transform: none; font-size: 13px; }
</style>
</head>
<body>

<nav id="top-nav">
  <div class="nav-inner">
    <a class="nav-brand" href="https://lbco.com">LUX BRAND CO<span class="dot">.</span></a>
    <div class="nav-links">
      <a class="nav-link" href="/upload">Upload</a>
      <a class="nav-link active" href="/download">Download</a>
    </div>
  </div>
</nav>

<main class="page">

  <section class="hero">
    <div class="hero-eyebrow">Brain · File Sharing</div>
    <h1 class="hero-title">What the team has shared.</h1>
    <p class="hero-sub">Search by what it's about. Pinned files are kept forever. Text-like files can be read inline.</p>
    <div class="hero-rule"></div>
  </section>

  <div class="search-row">
    <input class="search-input" type="text" id="q" placeholder="Search by what the file is about — or leave blank to list recent">
    <button class="search-go" id="go">Search</button>
  </div>

  <div class="filters">
    <div class="filter-group">
      <span class="filter-label">Project</span>
      <select class="filter-select" id="proj">
        <option value="">All</option>
        <option>Bid Builder</option>
        <option>GRS Education</option>
        <option>B2B Sales</option>
        <option>LuxOI Internal</option>
        <option>239 Rentals</option>
        <option>Living Hub</option>
      </select>
    </div>
    <div class="filter-group">
      <span class="filter-label">Architect</span>
      <select class="filter-select" id="arch">
        <option value="">All</option>
        <option>brady</option>
        <option>luke</option>
        <option>drew</option>
      </select>
    </div>
  </div>

  <div id="status">Loading recent files…</div>
  <div id="results" class="files"></div>

</main>

<script>
const $ = id => document.getElementById(id);

function fmtSize(b) {
  if (!b) return '—';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(2) + ' GB';
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// matches TEXT_TYPES + TEXT_EXTS in get_file_contents Lambda
function isTextLike(f) {
  const ct = (f.content_type || '').toLowerCase();
  const textTypes = ['text/', 'application/json', 'application/xml', 'application/javascript',
                     'application/x-yaml', 'application/yaml', 'application/x-sh', 'application/sql'];
  if (textTypes.some(t => ct.startsWith(t))) return true;
  return /\.(txt|md|json|yaml|yml|csv|tsv|log|xml|py|js|ts|tsx|jsx|html|css|scss|sh|sql|toml|ini|cfg|conf|env|tf|hcl)$/i.test(f.filename || '');
}

function renderFile(f, score) {
  const isPermanent = f.retention === 'permanent';
  const pin = isPermanent ? '<span class="pin" title="Permanent — kept forever">📌</span>' : '';
  const scoreBadge = (score != null) ? '<span class="score-badge">' + (score * 100).toFixed(0) + '% match</span>' : '';
  const proj = f.linked_project && f.linked_project !== 'unassigned'
    ? '<span class="sep">·</span><span class="proj">' + escHtml(f.linked_project) + '</span>'
    : '';
  const snippet = (f.snippet && f.snippet.trim())
    ? '<div class="file-snippet">' + escHtml(f.snippet) + '</div>'
    : '';
  const viewBtn = isTextLike(f)
    ? `<button class="file-action" onclick="viewFile('${escHtml(f.file_id)}', this)">View inline</button>`
    : '';

  return `<article class="file" data-id="${escHtml(f.file_id)}">
    <h3 class="file-name">${escHtml(f.filename)}${pin}${scoreBadge}</h3>
    <div class="file-meta">
      ${escHtml(fmtDate(f.created_at))}<span class="sep">·</span>${escHtml(f.architect || 'unknown')}<span class="sep">·</span>${escHtml(fmtSize(f.size_bytes))}${proj}
    </div>
    ${f.description ? '<div class="file-desc">' + escHtml(f.description) + '</div>' : ''}
    ${snippet}
    <div class="file-actions">
      <button class="file-action" onclick="dl('${escHtml(f.file_id)}', this)">Download</button>
      ${viewBtn}
      <button class="file-action danger" onclick="del('${escHtml(f.file_id)}', this.closest('.file').querySelector('.file-name').textContent.trim())">Delete</button>
    </div>
    <div class="file-id">${escHtml(f.file_id)}</div>
  </article>`;
}

async function load() {
  const q = $('q').value.trim();
  const proj = $('proj').value;
  const arch = $('arch').value;
  const status = $('status'), results = $('results');
  status.classList.remove('err');
  results.innerHTML = '';
  status.textContent = q ? 'Searching…' : 'Loading recent files…';
  status.style.display = 'block';

  try {
    const body = q ? { query: q, limit: 25 } : { limit: 50 };
    if (proj) body.linked_project = proj;
    if (arch) body.architect = arch;
    const endpoint = q ? '/api/search' : '/api/list';

    const r = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const text = await r.text();
    if (!r.ok) throw new Error(r.status + ': ' + text);
    const data = JSON.parse(text);

    // list_files → { files: [...] }   |   search_files → { results: [...] }
    const items = data.files || data.results || [];

    if (items.length === 0) {
      status.textContent = q ? 'No matches.' : 'No files yet.';
      return;
    }
    status.style.display = 'none';
    results.innerHTML = items.map(item => {
      const score = (typeof item.score === 'number') ? item.score : null;
      return renderFile(item, score);
    }).join('');
  } catch (err) {
    status.textContent = 'Failed: ' + err.message;
    status.classList.add('err');
  }
}

async function dl(file_id, btn) {
  const orig = btn.textContent;
  btn.textContent = '…';
  btn.disabled = true;
  try {
    const r = await fetch('/api/download-url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file_id }),
    });
    const text = await r.text();
    if (!r.ok) throw new Error(r.status + ': ' + text);
    const data = JSON.parse(text);
    const url = data.download_url;
    if (!url) throw new Error('No download_url in response');
    window.open(url, '_blank');
  } catch (err) {
    alert('Download failed: ' + err.message);
  } finally {
    btn.textContent = orig;
    btn.disabled = false;
  }
}

async function viewFile(file_id, btn) {
  const orig = btn.textContent;
  btn.textContent = '…';
  btn.disabled = true;
  try {
    const r = await fetch('/api/contents', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file_id }),
    });
    const text = await r.text();
    if (!r.ok) {
      const errData = (() => { try { return JSON.parse(text); } catch { return null; }})();
      const msg = errData?.error || text;
      throw new Error(r.status + ': ' + msg);
    }
    const data = JSON.parse(text);
    const contents = data.contents || '';
    const filename = data.filename || file_id;
    const truncated = data.truncated;
    const w = window.open('', '_blank');
    w.document.title = filename;
    w.document.write(
      '<!doctype html><html><head><meta charset="utf-8"><title>' + escHtml(filename) + '</title>' +
      '<style>body{font-family:ui-monospace,SF Mono,Menlo,monospace;font-size:13px;padding:32px;background:#faf8f3;color:#1a1a1a;line-height:1.6;margin:0;}' +
      '.head{font-family:-apple-system,Helvetica Neue,Arial,sans-serif;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#999;margin-bottom:6px;}' +
      'h1{font-family:-apple-system,Helvetica Neue,Arial,sans-serif;font-size:20px;font-weight:500;letter-spacing:-0.01em;margin-bottom:24px;color:#1a1a1a;}' +
      '.warn{font-family:-apple-system,Helvetica Neue,Arial,sans-serif;background:#f6f3ec;border-left:3px solid #c0140c;padding:12px 16px;margin-bottom:24px;font-size:13px;color:#444;letter-spacing:0;text-transform:none;}' +
      'pre{white-space:pre-wrap;word-break:break-word;margin:0;}</style></head><body>' +
      '<div class="head">Brain · file</div><h1>' + escHtml(filename) + '</h1>' +
      (truncated ? '<div class="warn">Truncated — showing first ' + (data.bytes_returned || 0).toLocaleString() + ' bytes of ' + (data.size_bytes || 0).toLocaleString() + '. Download for full file.</div>' : '') +
      '<pre>' + escHtml(contents) + '</pre></body></html>'
    );
    w.document.close();
  } catch (err) {
    alert('View failed: ' + err.message);
  } finally {
    btn.textContent = orig;
    btn.disabled = false;
  }
}

async function del(file_id, filename) {
  let arch = localStorage.getItem('lbco-architect');
  if (!arch) {
    arch = prompt('Your name (for delete audit):');
    if (!arch || !arch.trim()) return;
    arch = arch.trim();
    localStorage.setItem('lbco-architect', arch);
  }
  if (!confirm('Delete "' + filename + '"?\n\nThis cannot be undone.')) return;
  try {
    const r = await fetch('/api/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file_id, requesting_architect: arch }),
    });
    if (!r.ok) {
      const text = await r.text();
      const errData = (() => { try { return JSON.parse(text); } catch { return null; }})();
      const msg = errData?.error || text;
      throw new Error(r.status + ': ' + msg);
    }
    load();
  } catch (err) {
    alert('Delete failed: ' + err.message);
  }
}

$('go').addEventListener('click', load);
$('q').addEventListener('keypress', e => { if (e.key === 'Enter') load(); });
$('proj').addEventListener('change', load);
$('arch').addEventListener('change', load);
load();
</script>
</body>
</html>
